# Upstream service endpoints
upstream flask_web {
    server web:5000;
}

upstream flask_api {
    server api-service:5001;
}

server {
    listen 80;
    server_name _;

    # Maximum file upload size
    client_max_body_size 25M;

    # Health check endpoint (for load balancer/AWS EC2 checks)
    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }

    # External API Service (maps to api-service container on port 5001)
    location /external-api/ {
        proxy_pass http://flask_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Web Application (maps to web container on port 5000)
    location / {
        proxy_pass http://flask_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
