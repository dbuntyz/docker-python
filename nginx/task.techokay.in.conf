# ==============================================================================
# Nginx Reverse Proxy Configuration for Python Flask Application & API
# Domain: task.techokay.in
# Server: Host EC2 Nginx (/etc/nginx/sites-enabled/task.techokay.in)
# ==============================================================================

# Map for WebSocket Upgrade connection header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Upstream for Main Flask Web Application (Managed dynamically by Blue/Green deployment)
# Switches between Blue (127.0.0.1:5000) and Green (127.0.0.1:5002)
include /etc/nginx/conf.d/flask_upstream.conf;


# 2. Upstream for External Flask API Service (Docker port 5001)
upstream flask_api_backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

# ==============================================================================
# HTTPS Server Block (SSL managed by Certbot)
# ==============================================================================
server {
    server_name task.techokay.in;

    # Maximum allowed request body size (e.g., file uploads)
    client_max_body_size 25M;

    # Logging
    access_log /var/log/nginx/task.techokay.in.access.log;
    error_log /var/log/nginx/task.techokay.in.error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Lightweight Health Check Endpoint (AWS ALB / Uptime Monitoring)
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # 2. External API Service (Proxies to api-service container on 127.0.0.1:5001)
    location /external-api/ {
        proxy_pass http://flask_api_backend/;
        proxy_http_version 1.1;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # 3. Main Flask Web Application (Proxies to web container on 127.0.0.1:5000)
    location / {
        proxy_pass http://flask_web_backend;
        proxy_http_version 1.1;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Custom error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # SSL Configuration (managed by Certbot)
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/task.techokay.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/task.techokay.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ==============================================================================
# HTTP to HTTPS Redirect (Port 80)
# ==============================================================================
server {
    if ($host = task.techokay.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name task.techokay.in;
    return 404; # managed by Certbot
}
