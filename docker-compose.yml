services:
  # 1. Flask Web Application Service
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6371
    volumes:
      # Mount current directory to /app for live code reloading
      - .:/app
    depends_on:
      - redis
    networks:
      - my_external_network

  # 2. Redis Database Service (running on port 6371)
  redis:
    image: redis:alpine
    command: redis-server --port 6371
    ports:
      - "6371:6371"
    volumes:
      # Persist Redis database data
      - redis_data:/data
    networks:
      - my_external_network

# Named volume for Redis data storage
volumes:
  redis_data:

# Network configuration
networks:
  # Connect to an external network created outside this Compose file
  my_external_network:
    external: true
