name: CI/CD Pipeline - Security, Test, Docker Hub & Blue/Green Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. GITLEAKS JOB: Automated Secret & Credential Detection
  # ============================================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 2. LINT JOB: Static Analysis & Code Style
  # ============================================================================
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Run full style check according to .flake8 configuration
          flake8 . --count --statistics

  # ============================================================================
  # 3. TEST JOB: Automated Unit & Integration Tests
  # ============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6371:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Application and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Pytest Suite with Coverage
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6371
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ============================================================================
  # 4. TRIVY FS JOB: Filesystem & Dependency Vulnerability Scan
  # ============================================================================
  trivy-fs:
    name: Trivy Vulnerability Scan (Filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on repository files
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-fs-report.txt'

      - name: Display Trivy FS Scan Results
        if: always()
        run: |
          if [ -f trivy-fs-report.txt ]; then
            cat trivy-fs-report.txt
          fi

  # ============================================================================
  # 5. BUILD & PUSH JOB: Docker Hub Buildx, Trivy Image Scan & Push
  # ============================================================================
  build-and-push:
    name: Build, Scan & Push to Docker Hub
    needs: [gitleaks, lint, test, trivy-fs]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.image-names.outputs.image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute Docker Image Names and Tags
        id: image-names
        run: |
          # Set Docker repository (defaults to repository name e.g. docker-python)
          REPO_NAME="${{ secrets.DOCKERHUB_REPOSITORY }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="${{ github.event.repository.name }}"
          fi
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="docker-python"
          fi
          DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          FULL_IMAGE="${DOCKERHUB_USER}/${REPO_NAME}"
          SHA_TAG="${FULL_IMAGE}:${{ github.sha }}"
          LATEST_TAG="${FULL_IMAGE}:latest"

          echo "image_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Load Docker Image locally for Trivy Scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image-names.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Scan on Container Image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-names.outputs.image_tag }}
          scan-type: 'image'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Push Container Image to Docker Hub (SHA and latest tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-names.outputs.image_tag }}
            ${{ steps.image-names.outputs.image_latest }}
          cache-from: type=gha

  # ============================================================================
  # 6. DEPLOY JOB: Zero-Downtime Blue/Green Deployment to EC2 via SSH
  # ============================================================================
  deploy:
    name: Zero-Downtime Blue/Green Deploy (EC2)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'

    steps:
      - name: Check out repository deployment files
        uses: actions/checkout@v4

      - name: Copy Compose and Blue/Green script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "docker-compose.yml,scripts/deploy-blue-green.sh"
          target: "${{ secrets.TARGET_DIR || '/home/ubuntu/test-project-python' }}"

      - name: Deploy Image from Docker Hub via Blue/Green Script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -ex

            TARGET_DIR="${{ secrets.TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/home/${{ secrets.EC2_USER }}/test-project-python"
            fi
            DEPLOY_IMAGE="${{ needs.build-and-push.outputs.image_tag }}"

            echo "=================================================="
            echo "--> Target deployment directory: $TARGET_DIR"
            echo "--> Pulling & Deploying Docker Hub Image: $DEPLOY_IMAGE"
            echo "=================================================="

            cd "$TARGET_DIR"

            # Ensure blue-green deployment script is executable
            chmod +x scripts/deploy-blue-green.sh

            # Ensure Nginx conf.d directory and initial upstream file exist if missing
            sudo mkdir -p /etc/nginx/conf.d
            if [ ! -f /etc/nginx/conf.d/flask_upstream.conf ]; then
              echo "--> Initializing /etc/nginx/conf.d/flask_upstream.conf..."
              sudo tee /etc/nginx/conf.d/flask_upstream.conf > /dev/null << 'EOF'
            upstream flask_web_backend {
                server 127.0.0.1:5000;
                keepalive 32;
            }
            EOF
            fi

            # Authenticate Docker daemon to Docker Hub if private repo access needed
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "--> Authenticating Docker daemon on EC2 to Docker Hub..."
              if docker info >/dev/null 2>&1; then
                echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin || true
              elif sudo -n docker info >/dev/null 2>&1; then
                echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin || true
              fi
            fi

            # Execute Zero-Downtime Blue/Green Deployment
            echo "--> Executing Blue/Green zero-downtime deployment..."
            ./scripts/deploy-blue-green.sh "$DEPLOY_IMAGE"

            echo "=================================================="
            echo "--> Blue/Green Deployment successfully verified!"
            echo "=================================================="
