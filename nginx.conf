# Nginx Reverse Proxy Configuration for Flask Services

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Upstream backend definitions (supports Docker container names or localhost)
    upstream flask_web {
        server web:5000;
        # Fallback for host-based setup:
        # server 127.0.0.1:5000;
    }

    upstream flask_api {
        server api-service:5001;
        # Fallback for host-based setup:
        # server 127.0.0.1:5001;
    }

    server {
        listen 80;
        server_name localhost;

        # Client request body limit (adjust for file uploads)
        client_max_body_size 20M;

        # 1. Healthcheck endpoint for AWS ALB / monitoring
        location /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy\n';
        }

        # 2. Proxy requests for External API service (port 5001)
        location /external-api/ {
            proxy_pass http://flask_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 3. Proxy all other traffic to Main Flask Web app (port 5000)
        location / {
            proxy_pass http://flask_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
